fitting:
  max_iterations: 1000
  estimate_errors: true
  objective: experiments_equal
experiments:
- name: exp_1
  model_path: tests/model_test_flux_twostep.cps
  data_path: ''
  experiment_info:
    cell_compartment_name: cell
    syringe_compartment_name: syringe
    cell_volume: 0.0002
    fallback_inj_delay: 150.0
    cell_species_initial_conc:
      B: 10.0
      C: 10.0
    syringe_species_initial_conc:
      A{syringe}: 100.0
  sim_inj_info:
    number: 20
    volume: 2.0e-06
    delay: 150
  parameters:
    N_B_exp_1: 1.0
    N_C_exp_1: 1.0
    Kd_AB:
      value: 50
      log: true
    Kd_ABC:
      value: 0.1
      log: true
    dH_reaction_AB: -10000
    dH_reaction_ABC: 5000
    Offset_exp_1:
      value: 0.0
      fit: true
